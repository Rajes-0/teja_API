<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Exam Simulator</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="exam-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span>Test: API 510: Pressure Vessel Inspector</span>
                
            </div>
            <div class="header-right">
                <div class="timer-box">
                    <i class="fa-regular fa-clock"></i>
                    <span id="timer">02:45:00</span>
                </div>
                <span id="items-attempted">0/0 Items Attempted</span>
                <button id="home-btn" class="home-btn">🏠 Home</button>
                <button id="finish-section-btn">Finish Section</button>
                
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar with question numbers -->
            <div class="question-sidebar">
                <button class="sidebar-nav" id="sidebar-up">▲</button>
                <div id="question-list">
                    <!-- Question buttons will be generated by JavaScript -->
                </div>
                <button class="sidebar-nav" id="sidebar-down">▼</button>
            </div>

            <!-- Question Area -->
            <div class="question-area">
                <div id="question-content">
                    <p class="question-prompt" id="question-prompt-text">
                        <!-- Question text will be loaded here -->
                    </p>
                    <div class="resource-buttons">
                        <button id="reference-btn"><i class="fa-regular fa-file-lines"></i> Reference</button>
                        <button id="exhibit-btn"><i class="fa-regular fa-image"></i> Exhibit</button>
                        <button id="calculator-btn"><i class="fa-solid fa-calculator"></i> Calculator</button>
                    </div>
                    <ul class="answer-options" id="answer-options-list">
                        <!-- Answer options will be loaded here -->
                    </ul>
                    <!-- NEW: Explanation box added here -->
                    <div id="explanation-box" class="explanation-box"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-left-icons">
                <i class="fa-solid fa-gear icon" id="settings-icon" title="Settings"></i>
                <i class="fa-solid fa-th icon" id="review-icon" title="Section Review"></i>
                <i class="fa-solid fa-question-circle icon" id="help-icon" title="Help"></i>
            </div>
            <div class="footer-right-buttons">
                <button id="comment-btn"><i class="fa-regular fa-comment"></i> Comment</button>
                <button id="flag-btn"><i class="fa-regular fa-flag"></i> Flag for Review</button>

                
                
                <button id="back-btn">&lt; Back</button>
                <button id="next-btn">Next &gt;</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="calculator-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Calculator</h3>
            <input type="text" id="calculator-display" disabled>
            <div class="calc-buttons">
                <button>7</button><button>8</button><button>9</button><button class="operator">/</button>
                <button>4</button><button>5</button><button>6</button><button class="operator">*</button>
                <button>1</button><button>2</button><button>3</button><button class="operator">-</button>
                <button>0</button><button>.</button><button id="calc-clear">C</button><button class="operator">+</button>
                <button class="equals">=</button>
            </div>
        </div>
    </div>
    
    <div id="resource-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="resource-title"></h3>
            <p id="resource-content" style="max-height: 60vh; overflow-y: auto;"></p>
        </div>
    </div>

    <div id="comment-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Leave a Comment</h3>
            <textarea id="comment-textarea" placeholder="Type your comment here..."></textarea>
            <button id="save-comment-btn">Save</button>
        </div>
    </div>

    <div id="review-modal" class="modal">
        <div class="modal-content" style="width: 80%; max-width: 800px;">
            <span class="close-btn">&times;</span>
            <h3>Section Review</h3>
            <div id="review-filters">
                <label><input type="checkbox" value="unattempted" checked> Unattempted</label>
                <label><input type="checkbox" value="attempted" checked> Attempted</label>
                <label><input type="checkbox" value="flagged" checked> Flagged</label>
            </div>
            <div id="review-grid"></div>
        </div>
    </div>
    
    <div id="finish-modal" class="modal">
        <div class="modal-content">
             <span class="close-btn">&times;</span>
            <h3>Confirm Finish Section</h3>
            <p>Are you sure you want to finish this section? You will not be able to return.</p>
            <button id="confirm-finish-btn" style="background-color: var(--primary-green); color: white;">Finish Section</button>
            <button id="cancel-finish-btn">Cancel</button>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
